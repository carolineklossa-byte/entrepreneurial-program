<title id="page-title">Le Terrain</title>
<link id="page-font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&display=swap">
<style id="page-style">
  :root{
    --black:#000000;
    --ink:#141110;
    --paper:#F6F5F3;
    --surface:#FFFFFF;
    --line:#E4E0DA;
    --line-strong:#CFC9C0;
    --grey-mid:#8B8580;
    --grey-quiet:#B4AEA7;
    --cherry:#B88C63;
    --cherry-dark:#7A5B3E;
    --cherry-light:#D9B58F;
    --cherry-tint:#F1E7DB;
    --white:#FFFFFF;
    --focus:#7A5B3E;
    --status-open-bg:#2C2320;
    --status-open-fg:#E9C9A6;
    --status-locked-bg:#ECE9E4;
    --status-locked-fg:#8B8580;
    --status-closed-bg:#141110;
    --status-closed-fg:#F6F5F3;

    /* accents des 3 cas du Round 2 (AI Case Study) : une couleur par cas,
       pour distinguer visuellement les rubriques et cas entre eux. */
    --case1:#A67518;
    --case1-tint:#E8C57C;
    --case2:#A67518;
    --case2-tint:#E8C57C;
    --case3:#A67518;
    --case3-tint:#E8C57C;
  }

  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px;}

  .wrap{max-width:760px;margin:0 auto;padding:0 28px;}

  /* ---------- admin banner ---------- */
  .admin-banner{background:var(--ink);color:var(--cherry-light);font-size:12px;font-weight:700;letter-spacing:.03em;text-align:center;padding:9px 14px;}
  .admin-banner.preview{background:var(--cherry-dark);}
  .admin-banner button{margin-left:10px;background:none;border:none;color:inherit;font-family:inherit;font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;padding:0;}

  /* ---------- header ---------- */
  .site-header{border-bottom:1px solid var(--line-strong);background:var(--paper);}
  .site-header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:26px;padding-bottom:22px;max-width:820px;}
  .logo{display:flex;align-items:center;}
  .logo img{height:26px;width:auto;display:block;}
  .eyebrow-tag{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--grey-mid);font-weight:600;}

  /* ---------- hero ---------- */
  .hero{background:var(--black);color:var(--white);}
  .hero .wrap{max-width:820px;padding-top:76px;padding-bottom:72px;}
  .hero-eyebrow{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--cherry);font-weight:700;margin:0 0 22px;}
  .hero h1{font-size:clamp(40px,6vw,58px);font-weight:900;letter-spacing:-0.02em;line-height:1.03;margin:0 0 30px;text-wrap:balance;}
  .hero p{font-size:17px;line-height:1.65;color:#D9D6D2;max-width:600px;margin:0 0 20px;font-weight:400;}
  .hero .lede{color:var(--white);font-size:19px;font-weight:500;line-height:1.5;}
  .hero .rule{height:1px;background:linear-gradient(90deg,var(--cherry),transparent);width:120px;margin:34px 0 30px;}
  .hero .stakes{font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;color:var(--cherry-dark);background:var(--cherry-tint);display:inline-block;padding:10px 16px;margin:6px 0 30px;}
  .hero .close-line{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-0.01em;margin:0;}

  /* ---------- track section ---------- */
  .track-section{padding:68px 0 40px;}
  .track-head{margin-bottom:26px;max-width:600px;}
  .track-head .eyebrow{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--cherry-dark);font-weight:700;margin:0 0 12px;display:block;}
  .track-head h2{font-size:32px;font-weight:900;letter-spacing:-0.01em;margin:0 0 14px;text-wrap:balance;}
  .track-head p{font-size:15.5px;line-height:1.6;color:var(--grey-mid);margin:0;}

  /* ---------- calendrier des dates clés ---------- */
  .key-dates{border:1px solid var(--line-strong);background:var(--surface);padding:20px 22px;margin-bottom:24px;}
  .key-dates-title{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;font-weight:800;color:var(--cherry-dark);margin:0 0 4px;}
  .key-dates-grid{display:grid;grid-template-columns:minmax(170px,1.3fr) 1fr 1fr;column-gap:24px;}
  .kd-row{display:contents;}
  .kd-round{font-size:14px;font-weight:700;color:var(--ink);padding:14px 0;border-top:1px solid var(--line);display:flex;align-items:center;}
  .kd-item{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:3px;}
  .kd-item-empty{padding:14px 0;border-top:1px solid var(--line);}
  .kd-item-label{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey-mid);font-weight:700;}
  .kd-item-value{font-size:13.5px;font-weight:700;color:var(--grey-quiet);font-variant-numeric:tabular-nums;}
  .kd-item.kd-item-set .kd-item-value{color:var(--ink);font-variant-numeric:normal;}
  .key-dates-grid > .kd-row:first-child > *{border-top:none;padding-top:0;}

  /* ---------- progress strip ---------- */
  .progress-strip{display:flex;align-items:center;gap:16px;margin:26px 0 34px;}
  .progress-track{flex:1;height:3px;background:var(--line-strong);position:relative;border-radius:2px;overflow:hidden;}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;background:var(--cherry);border-radius:2px;}
  .progress-label{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--cherry-dark);white-space:nowrap;font-variant-numeric:tabular-nums;}

  /* ---------- identification card ---------- */
  .id-card{background:var(--surface);border:1px dashed var(--line-strong);padding:20px 24px;margin-bottom:30px;}
  .id-card h3{font-size:17px;font-weight:800;margin:0 0 14px;}
  .id-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .id-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px;}
  .id-field label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--grey-mid);font-weight:700;}
  .id-field input{font-family:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);}
  .id-submit{font-family:inherit;font-weight:800;font-size:13px;letter-spacing:0.03em;background:var(--ink);color:var(--white);border:none;padding:11px 18px;cursor:pointer;white-space:nowrap;}
  .id-submit:hover{background:var(--cherry-dark);}
  .id-greeting{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .id-greeting p{margin:0;font-size:15px;}
  .id-greeting strong{font-weight:800;}
  .id-reset{font-size:12.5px;color:var(--grey-mid);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;font-family:inherit;}
  .id-reset:hover{color:var(--ink);}

  /* ---------- tabs (liste verticale pleine largeur, sans colonne latérale) ---------- */
  .steps-locked-hint{font-size:13.5px;line-height:1.6;color:var(--grey-mid);font-style:italic;padding:18px 0 4px;margin:0;}
  .tabs{display:flex;flex-direction:column;border:1px solid var(--line-strong);margin-bottom:0;}
  .tab{width:100%;background:none;border:none;border-bottom:1px solid var(--line);border-left:3px solid transparent;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--grey-mid);padding:13px 18px;cursor:pointer;white-space:normal;text-align:left;display:flex;align-items:center;gap:10px;}
  .tab:last-child{border-bottom:none;}
  .tab .tab-dot{width:6px;height:6px;border-radius:50%;background:var(--grey-quiet);flex:0 0 auto;}
  .tab[data-status="open"] .tab-dot{background:var(--cherry);}
  .tab[data-status="closed"] .tab-dot{background:var(--ink);}
  .tab[aria-selected="true"]{color:var(--ink);background:var(--cherry-tint);border-left-color:var(--cherry);}
  .tab:hover{color:var(--ink);}

  /* ---------- FAQ ---------- */
  .faq-section{padding:0 0 6px;}
  .faq-details{border-top:1px solid var(--line-strong);padding:18px 0;}
  .faq-details summary{cursor:pointer;font-size:12.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--grey-mid);list-style:none;display:flex;align-items:center;gap:8px;}
  .faq-details summary::-webkit-details-marker{display:none;}
  .faq-details summary::after{content:'+';margin-left:auto;font-size:17px;font-weight:400;color:var(--cherry-dark);}
  .faq-details[open] summary::after{content:'–';}
  .faq-details summary:hover{color:var(--ink);}
  .faq-body{padding-top:20px;max-width:600px;}
  .faq-item{margin-bottom:20px;}
  .faq-item:last-child{margin-bottom:0;}
  .faq-q{font-size:14.5px;font-weight:800;margin:0 0 5px;letter-spacing:-0.005em;}
  .faq-a{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0;}

  .panel-wrap{padding-top:28px;}
  .admin-preview-note{background:var(--status-locked-bg);color:var(--grey-mid);font-size:12px;font-weight:700;padding:9px 12px;margin-bottom:16px;}
  .spotlight .admin-preview-note{background:rgba(255,255,255,.08);color:var(--cherry-light);}

  .card{background:var(--surface);border:1px solid var(--line);padding:26px 26px 28px;}
  .card[data-status="open"]{border-color:var(--cherry);box-shadow:inset 3px 0 0 var(--cherry);}
  .card[data-status="locked"]{background:var(--paper);border-style:dashed;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .stage-label{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;color:var(--grey-mid);}
  .pill{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:2px;white-space:nowrap;}
  .pill[data-s="open"]{background:var(--status-open-bg);color:var(--status-open-fg);}
  .pill[data-s="locked"]{background:var(--status-locked-bg);color:var(--status-locked-fg);}
  .pill[data-s="closed"]{background:var(--status-closed-bg);color:var(--status-closed-fg);}

  .card h3{font-size:23px;font-weight:800;letter-spacing:-0.01em;margin:2px 0 10px;}
  .card .dates{font-size:12.5px;color:var(--cherry-dark);font-weight:600;margin-bottom:16px;font-variant-numeric:tabular-nums;}
  .card .body p{font-size:15px;line-height:1.65;color:var(--ink);margin:0 0 14px;}
  .card .body p:last-child{margin-bottom:0;}
  .card .locked-note{font-size:14px;line-height:1.6;color:var(--grey-mid);font-style:italic;margin:0;}
  .callout{background:var(--cherry-tint);border-left:3px solid var(--cherry);padding:14px 16px;font-size:13.5px;line-height:1.55;color:var(--cherry-dark);font-weight:600;margin-top:16px;}
  .callout.dark{background:var(--black);color:var(--white);border-left-color:var(--cherry);}
  .callout.on-dark{background:rgba(255,255,255,.08);color:var(--cherry-light);border-left-color:var(--cherry);}
  .cal-link{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;letter-spacing:0.04em;color:var(--cherry-dark);text-decoration:none;border-bottom:1px solid var(--cherry);padding-bottom:2px;}
  .cal-link:hover{color:var(--ink);border-color:var(--ink);}

  /* ---------- AI Case Study content ---------- */
  .card .body .case-intro p{font-size:14.5px;line-height:1.6;color:var(--grey-mid);margin:0 0 12px;}
  .case-intro p:last-child{margin-bottom:0;}

  /* rubriques Growth / Product : grand séparateur éditorial avant chaque groupe de cas */
  .case-rubric{margin-top:56px;}
  .case-rubric.case-rubric-first{margin-top:0;}
  .case-rubric.rubric-growth{--accent:var(--case1);}
  .case-rubric.rubric-product{--accent:var(--case3);}
  .card .body .case-rubric .case-kicker{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;font-size:27px;letter-spacing:0;text-transform:none;color:var(--accent);margin:0 0 12px;}
  .case-rubric .case-kicker::after{content:"";display:block;width:46px;height:3px;background:var(--accent);margin-top:12px;border-radius:2px;}

  /* chaque cas numéroté : bien plus d'air, et une couleur d'accent qui lui est propre */
  .case-block{margin-top:64px;padding-top:40px;border-top:3px solid var(--accent, var(--line));}
  .case-block.case-1{--accent:var(--case1);}
  .case-block.case-2{--accent:var(--case2);}
  .case-block.case-3{--accent:var(--case3);}

  .case-heading{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;}
  .case-heading .case-num{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;font-size:44px;line-height:1;color:var(--accent);flex:0 0 auto;}
  .case-heading .case-heading-text{padding-top:8px;}
  .card .body .case-mini{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;font-weight:800;color:var(--accent);margin:0 0 5px;}
  .card .body h4{font-size:24px;font-weight:800;letter-spacing:-0.01em;margin:0;color:var(--ink);}
  .card .body h4 span{font-weight:500;color:var(--grey-mid);font-size:15px;margin-left:8px;}

  .case-quote{border-left:3px solid var(--accent, var(--cherry));padding:4px 0 4px 18px;margin:20px 0 24px;}
  .case-quote .case-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:800;color:var(--accent, var(--grey-mid));display:block;margin-bottom:8px;}
  .card .body .case-quote p{margin:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:400;font-size:17.5px;line-height:1.5;color:var(--ink);}

  .card .body .case-questions-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:800;color:var(--accent, var(--cherry-dark));margin:28px 0 4px;padding-top:18px;border-top:1px solid var(--line);}
  .case-sub h5{font-size:14.5px;font-weight:800;color:var(--ink);margin:16px 0 6px;}
  .case-sub ul{margin:0 0 4px;padding-left:18px;}
  .case-sub li{font-size:14.5px;line-height:1.55;color:var(--ink);margin-bottom:5px;}
  .card .body .case-sub > p{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0 0 8px;}
  .case-row{display:flex;flex-wrap:wrap;gap:2px 16px;padding:12px 0;border-top:1px solid var(--line);}
  .case-row:first-of-type{border-top:none;padding-top:16px;}
  .case-row strong{flex:0 0 130px;font-size:13.5px;font-weight:800;color:var(--accent, var(--ink));}
  .card .body .case-row p{flex:1;min-width:200px;font-size:14.5px;line-height:1.55;color:var(--ink);margin:0;}
  .case-dark{background:var(--ink);color:var(--white);padding:18px 20px;margin:20px 0;border-left:4px solid var(--accent, var(--cherry));}
  .card .body .case-dark p{color:#CFCAC3;font-size:14px;line-height:1.55;margin:0;}
  .card .body .case-dark p strong{color:var(--accent-tint, var(--white));}
  .case-profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:var(--ink);padding:18px 20px;margin:20px 0;border-left:4px solid var(--accent, var(--cherry));}
  .case-profiles .profile-eyebrow{grid-column:1/-1;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-tint, var(--cherry-light));margin-bottom:2px;}
  .case-profiles .profile h6{font-size:13.5px;font-weight:800;margin:0 0 4px;color:var(--white);}
  .card .body .case-profiles .profile p{font-size:12.5px;line-height:1.5;color:#CFCAC3;margin:0;}
  .case-recos{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin:14px 0 18px;}
  .case-reco{display:flex;gap:10px;font-size:13.5px;line-height:1.4;color:var(--ink);}
  .case-reco span{color:var(--accent, var(--cherry-dark));font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .case-moments{margin:10px 0 4px;}
  .case-moment{padding:12px 0;border-top:1px solid var(--line);}
  .case-moment:first-child{border-top:none;padding-top:0;}
  .case-moment strong{display:block;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent, var(--grey-mid));margin-bottom:3px;}
  .card .body .case-moment p{font-size:14.5px;line-height:1.55;color:var(--ink);margin:0;}

  /* ---------- Round 1 spotlight ---------- */
  .card.spotlight{background:var(--ink);border:none;box-shadow:none;color:var(--white);padding:36px 32px 38px;position:relative;}
  .spotlight .card-head .stage-label{color:var(--cherry-light);}
  .spotlight .quote-mark{font-size:64px;line-height:1;font-weight:900;color:var(--cherry);opacity:.5;margin:0 0 -18px;}
  .spotlight h3{font-size:26px;color:var(--white);}
  .spotlight .dates{color:var(--cherry-light);}
  .spotlight .question-text{font-size:19px;line-height:1.55;font-weight:500;color:var(--white);margin:0 0 18px;text-wrap:balance;}
  .spotlight .body p{color:#CFCAC3;font-size:14.5px;}
  .spotlight .locked-note{color:#CFCAC3;}

  .answer-instructions{margin-top:24px;border-top:1px solid #3A342F;padding-top:22px;}
  .answer-instructions p{font-size:15px;line-height:1.6;color:var(--white);margin:0;}
  .answer-instructions strong{color:var(--cherry-light);}

  /* même consigne d'envoi par e-mail, mais sur une carte claire (Round 2/3/4/pitch) :
     l'ancienne classe .answer-instructions est pensée pour la carte sombre du Round 1
     (texte blanc) et rendait le texte invisible ici (blanc sur fond blanc). */
  .email-note{margin-top:24px;border-top:1px solid var(--line);padding-top:22px;}
  .email-note p{font-size:15px;line-height:1.6;color:var(--ink);margin:0;}
  .email-note strong{color:var(--cherry-dark);}

  /* ---------- footer ---------- */
  .site-footer{border-top:1px solid var(--line-strong);background:var(--paper);margin-top:20px;}
  .site-footer .wrap{max-width:820px;padding:26px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .site-footer span{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey-quiet);font-weight:600;}
  .site-footer a{color:var(--grey-mid);text-decoration:none;}
  .site-footer a:hover{color:var(--cherry-dark);}
  .footer-admin-trigger{font-family:inherit;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey-quiet);font-weight:600;background:none;border:none;padding:0;margin:0;cursor:default;}
  .admin-unlock{display:none;gap:8px;align-items:center;flex-wrap:wrap;max-width:820px;margin:0 auto;padding:0 28px 22px;}
  .admin-unlock.open{display:flex;}
  .admin-unlock input{font-family:inherit;font-size:12px;padding:7px 10px;border:1px solid var(--line-strong);background:var(--white);color:var(--ink);}
  .admin-unlock button{font-family:inherit;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--cherry);border:none;padding:8px 14px;cursor:pointer;}
  .admin-unlock button:hover{background:#241F1B;}
  .admin-code-error{font-size:11px;color:#A3453A;}

  @media (max-width:560px){
    .card{padding:20px 18px 22px;}
    .card.spotlight{padding:26px 20px 28px;}
    .hero .wrap{padding-top:56px;padding-bottom:52px;}
    .id-row{flex-direction:column;align-items:stretch;}
    .id-submit{width:100%;}
    .case-profiles{grid-template-columns:1fr;}
    .case-recos{grid-template-columns:1fr;}
    .case-row strong{flex-basis:100%;}
    .case-block{margin-top:48px;padding-top:30px;}
    .case-rubric{margin-top:42px;}
    .case-heading{gap:10px;}
    .case-heading .case-num{font-size:32px;}
    .card .body h4{font-size:20px;}
    .card .body .case-quote p{font-size:16px;}
    .key-dates-grid{display:block;}
    .kd-row{display:block;border-top:1px solid var(--line);padding:12px 0;}
    .key-dates-grid > .kd-row:first-child{border-top:none;padding-top:0;}
    .kd-round{border-top:none;padding:0 0 8px;}
    .kd-item{border-top:none;padding:2px 0;flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;}
    .kd-item-empty{display:none;}
  }

  @media (prefers-reduced-motion: no-preference){
    .reveal{animation:rise 0.6s ease both;}
    .id-card,.panel-wrap{animation:rise 0.45s ease both;}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }

  /* ---------- admin panel ---------- */
  #admin-panel{position:fixed;right:18px;bottom:18px;width:330px;max-width:calc(100vw - 36px);background:var(--ink);color:var(--white);padding:18px 18px 16px;font-size:12.5px;z-index:50;box-shadow:0 12px 32px rgba(0,0,0,.35);max-height:calc(100vh - 36px);overflow-y:auto;}
  #admin-panel h4{margin:16px 0 4px;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--cherry);font-weight:700;}
  #admin-panel h4:first-child{margin-top:0;}
  #admin-panel .sub{color:#B8B2AB;margin:0 0 14px;font-size:11.5px;line-height:1.5;}
  .admin-row{margin-bottom:12px;}
  .admin-row .lbl{display:block;font-weight:700;margin-bottom:6px;color:var(--white);}
  .seg{display:flex;border:1px solid #3A342F;}
  .seg button{flex:1;background:transparent;border:none;color:#B8B2AB;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.03em;padding:7px 4px;cursor:pointer;border-right:1px solid #3A342F;}
  .seg button:last-child{border-right:none;}
  .seg button[aria-pressed="true"]{background:var(--cherry);color:var(--ink);}
  .seg button:hover:not([aria-pressed="true"]){background:#241F1B;color:var(--white);}
  #admin-publish{width:100%;margin-top:14px;background:var(--cherry);color:var(--ink);border:none;font-family:inherit;font-weight:800;font-size:12.5px;letter-spacing:0.04em;padding:11px;cursor:pointer;}
  #admin-publish:hover{background:var(--cherry-dark);color:var(--white);}
  #admin-publish:disabled{opacity:.5;cursor:default;}
  #admin-status{margin-top:10px;font-size:11.5px;color:#B8B2AB;min-height:14px;}
  #admin-toggle{position:fixed;right:18px;bottom:18px;z-index:49;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--cherry);border:none;cursor:pointer;font-size:15px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .cand-row{border-top:1px solid #3A342F;padding-top:10px;margin-top:10px;}

  .cand-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
  .cand-grid select{width:100%;font-size:9.5px;background:#1D1815;color:#fff;border:1px solid #3A342F;padding:3px 1px;font-family:inherit;}
  .cand-remove{margin-top:6px;background:transparent;border:none;color:#C77A6B;font-size:11px;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit;}
  #admin-add-cand{width:100%;margin-top:12px;background:transparent;border:1px dashed #3A342F;color:#B8B2AB;font-family:inherit;font-weight:700;font-size:11.5px;padding:9px;cursor:pointer;}
  #admin-add-cand:hover{color:var(--white);border-color:var(--cherry);}
  #preview-as-candidate{width:100%;margin-bottom:14px;background:var(--cherry);color:var(--ink);border:none;font-family:inherit;font-weight:800;font-size:12px;letter-spacing:0.03em;padding:10px;cursor:pointer;}
  #preview-as-candidate:hover{background:var(--cherry-light);}
</style>

      openHtml: (
        '<div class="case-intro">' +
          '<p>Une problématique réelle de Zoī, à résoudre à l’aide de l’IA, jusqu’à un prototype fonctionnel. Vous finaliserez et présenterez votre solution le jour du Pitch Day.</p>' +
          '<p>Deux rubriques vous sont proposées&nbsp;: Growth, qui comprend deux cas, et Product, qui en comprend un. Vous n’en traitez qu’un seul, celui qui correspond le mieux à votre profil.</p>' +
          '<p>Nous ne cherchons pas à voir si vous savez produire du contenu avec l’IA. Nous regardons si vous choisissez le bon problème, si vous comprenez un business de l’extérieur, et si vous construisez quelque chose qui fonctionne. Nous ne vous transmettons aucune donnée interne&nbsp;: toutes les informations dont vous avez besoin sont publiques, et cette recherche fait partie de l’exercice.</p>' +
        '</div>' +
        '<div class="case-dark">' +
          '<p><strong>Avant de choisir votre cas</strong>, prenez le temps de comprendre Zoī en profondeur&nbsp;: ce que nous faisons, le produit que nous vendons réellement, à qui nous nous adressons, à quel prix, et ce qui se joue entre l’intérêt et l’achat. Notre positionnement, nos offres et nos prix sont publics&nbsp;: le travail attendu est celui d’une vraie enquête, pas d’une lecture rapide de la page d’accueil.</p>' +
          '<p style="margin-top:8px">Vous n’avez pas nos données&nbsp;: posez des hypothèses et dites-le clairement. Une hypothèse assumée vaut mieux qu’un chiffre inventé.</p>' +
        '</div>' +

        '<div class="case-rubric case-rubric-first rubric-growth">' +
          '<p class="case-kicker">Growth</p>' +
          '<div class="case-intro"><p>Deux cas composent cette rubrique. Le cas 1 porte sur l’acquisition et la conversion de nos clients particuliers. Le cas 2 s’adresse aux profils plus commerciaux et porte sur la prospection B2B.</p></div>' +

            '<span class="eyebrow">Processus de recrutement</span>' +
            '<h2>Les étapes</h2>' +
            '<p>Cinq étapes, jusqu’au Pitch Day. Vous recevrez un e-mail dès que la suivante s’ouvre pour vous.</p>' +
          '</div>' +
          keyDatesMarkup() +
          progressMarkup() +
          idCardMarkup() +
          stepsBlock +
        '</div>' +
      '</section>' +
      faqSectionMarkup()
    );
  }

  function fullDocument(state){
    // Sélection par id explicite, jamais par querySelector('style')/('title') seul :
    // la plateforme d'hébergement des Artifacts injecte son propre <style> de reset
    // (et potentiellement d'autres balises) dans le <head> réellement servi au
    // navigateur, avant notre contenu. Un querySelector générique attraperait ce
    // style de la plateforme au lieu du nôtre et republierait une page sans son CSS.
    var titleEl = document.getElementById('page-title') || document.querySelector('title');
    var linkEl = document.getElementById('page-font-link') || document.querySelector('link[rel="stylesheet"]');
    var styleEl = document.getElementById('page-style') || document.querySelector('style');
    var headerEl = document.querySelector('.site-header');
    var footerEl = document.querySelector('.site-footer');
    var mainScriptEl = document.getElementById('main-script');

    return '<!doctype html>\n<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      titleEl.outerHTML + linkEl.outerHTML + styleEl.outerHTML +
      '</head><body>' +
      '<script id="state-json" type="application/json">' + JSON.stringify(state) + '<' + '/script>' +
      '<div id="admin-banner-slot"></div>' +
      headerEl.outerHTML +
      '<div id="app"></div>' +
      footerEl.outerHTML +
      '<button id="admin-toggle" type="button" aria-label="Mode admin" title="Mode admin" hidden>⚙</button>' +
      '<div id="admin-panel" hidden></div>' +
      mainScriptEl.outerHTML +
      '</body></html>';
  }

  function attachHandlers(){
    document.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        ACTIVE_TAB = btn.dataset.key;
        try{ history.replaceState(null, '', '#'+ACTIVE_TAB); }catch(e){}
        render();
      });
    });

    var idSubmit = document.getElementById('id-submit');
    if (idSubmit){
      idSubmit.addEventListener('click', function(){
        var first = document.getElementById('id-first').value.trim();
        var last = document.getElementById('id-last').value.trim();
        if (!first || !last) return;
        CURRENT_CANDIDATE = {first:first, last:last};
        try{ localStorage.setItem('zoiEpCandidate', JSON.stringify(CURRENT_CANDIDATE)); }catch(e){}
        render();
      });
    }
    var idReset = document.getElementById('id-reset');
    if (idReset){
      idReset.addEventListener('click', function(){
        CURRENT_CANDIDATE = null;
        try{ localStorage.removeItem('zoiEpCandidate'); }catch(e){}
        render();
      });
    }
  }

  function render(){
    document.getElementById('app').innerHTML = template();
    var bannerSlot = document.getElementById('admin-banner-slot');
    if (bannerSlot){
      if (isAdminUrl && PREVIEW_MODE){
        bannerSlot.innerHTML = '<div class="admin-banner preview">Aperçu candidat actif, vous voyez la page comme un candidat sans statut individuel <button type="button" id="exit-preview">Revenir au mode admin</button></div>';
      } else if (isAdminUrl){
        bannerSlot.innerHTML = '<div class="admin-banner">Mode admin · vous voyez le contenu de toutes les étapes, y compris verrouillées <button type="button" id="enter-preview">👁 Voir comme un candidat</button><button type="button" id="exit-admin">Quitter le mode admin</button></div>';
      } else {
        bannerSlot.innerHTML = '';
      }
    }
    attachHandlers();
    var exitPreviewBtn = document.getElementById('exit-preview');
    if (exitPreviewBtn){
      exitPreviewBtn.addEventListener('click', function(){
        PREVIEW_MODE = false;
        render();
      });
    }
    var enterPreviewBtn = document.getElementById('enter-preview');
    if (enterPreviewBtn){
      enterPreviewBtn.addEventListener('click', function(){
        PREVIEW_MODE = true;
        render();
      });
    }
    var exitAdminBtn = document.getElementById('exit-admin');
    if (exitAdminBtn){
      exitAdminBtn.addEventListener('click', function(){
        try{ localStorage.removeItem(ADMIN_KEY); }catch(e){}
        location.reload();
      });
    }
  }
  render();

  // ---------------- Déverrouillage équipe (toujours présent, discret) ----------------
  // "Document confidentiel" dans le pied de page sert de déclencheur discret pour
  // révéler un petit champ de code, sans jamais dépendre d'un paramètre d'URL.
  (function(){
    var reveal = document.getElementById('admin-reveal');
    var unlockBox = document.getElementById('admin-unlock');
    var codeInput = document.getElementById('admin-code');
    var codeBtn = document.getElementById('admin-code-submit');
    var codeError = document.getElementById('admin-code-error');
    if (!reveal || !unlockBox) return;
    if (isAdminUrl){ return; } // déjà déverrouillé, rien à faire ici
    reveal.addEventListener('click', function(){
      unlockBox.classList.toggle('open');
      if (unlockBox.classList.contains('open')) codeInput.focus();
    });
    function tryUnlock(){
      if ((codeInput.value || '').trim() === ADMIN_CODE){
        try{ localStorage.setItem(ADMIN_KEY, '1'); }catch(e){}
        location.reload();
      } else {
        codeError.textContent = 'Code incorrect.';
        codeInput.value = '';
        codeInput.focus();
      }
    }
    if (codeBtn) codeBtn.addEventListener('click', tryUnlock);
    if (codeInput) codeInput.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter') tryUnlock();
    });
  })();

  // ---------------- Admin mode ----------------
  if (isAdminUrl){
    var toggleBtn = document.getElementById('admin-toggle');
    var panel = document.getElementById('admin-panel');
    toggleBtn.hidden = false;

    function buildPanel(){
      var html = '<button type="button" id="preview-as-candidate">\u{1F441} Voir comme un candidat</button>';
      html += '<h4>Mode admin</h4><p class="sub">Statuts par défaut, puis publiez pour que tous les candidats voient la mise à jour.</p>';
      STAGES.forEach(function(s){
        var cur = escStatus(STATE.stages[s.key]);
        html += '<div class="admin-row"><span class="lbl">'+s.label+' · '+s.title+'</span>' +
          '<div class="seg" role="group" aria-label="Statut '+s.label+'">' +
            ['locked','open','closed'].map(function(st){
              return '<button type="button" data-key="'+s.key+'" data-val="'+st+'" aria-pressed="'+(cur===st)+'">'+PILL_LABEL[st]+'</button>';
            }).join('') +
          '</div></div>';
      });

      html += '<h4>Candidats</h4><p class="sub">Déverrouillez individuellement une étape pour un candidat précis. "Défaut" suit le statut général ci-dessus.</p>';
      STATE.candidates.forEach(function(c, idx){
        html += '<div class="cand-row" data-idx="'+idx+'">' +
          '<input type="text" class="cand-name" placeholder="Prénom Nom" value="'+(c.name||'').replace(/"/g,'&quot;')+'">';
        html += '<div class="cand-cols">' + STAGES.map(function(s){ return '<span>'+(s.spotlight?'R1':(s.label.indexOf('Round')===0?s.label.replace('Round ','R'):'JJ'))+'</span>'; }).join('') + '</div>';
        html += '<div class="cand-grid">' + STAGES.map(function(s){
          var ov = (c.overrides && c.overrides[s.key]) || '';
          return '<select class="cand-ov" data-key="'+s.key+'">' +
            ['','locked','open','closed'].map(function(st){
              var lbl = st==='' ? 'Défaut' : PILL_LABEL[st];
              return '<option value="'+st+'"'+(ov===st?' selected':'')+'>'+lbl+'</option>';
            }).join('') +
            '</select>';
        }).join('') + '</div>';
        html += '<button type="button" class="cand-remove" data-idx="'+idx+'">Retirer</button>';
        html += '</div>';
      });
      html += '<button type="button" id="admin-add-cand">+ Ajouter un candidat</button>';

      html += '<button id="admin-publish" type="button">Publier les modifications</button>' +
              '<div id="admin-status"></div>';
      panel.innerHTML = html;

      panel.querySelectorAll('.admin-row .seg button').forEach(function(btn){
        btn.addEventListener('click', function(){
          STATE.stages[btn.dataset.key] = btn.dataset.val;
          render();
          buildPanel();
        });
      });
      panel.querySelectorAll('.cand-row').forEach(function(row){
        var idx = parseInt(row.dataset.idx, 10);
        row.querySelector('.cand-name').addEventListener('change', function(e){
          STATE.candidates[idx].name = e.target.value.trim();
        });
        row.querySelectorAll('.cand-ov').forEach(function(sel){
          sel.addEventListener('change', function(){
            if (!STATE.candidates[idx].overrides) STATE.candidates[idx].overrides = {};
            if (sel.value){ STATE.candidates[idx].overrides[sel.dataset.key] = sel.value; }
            else { delete STATE.candidates[idx].overrides[sel.dataset.key]; }
          });
        });
        row.querySelector('.cand-remove').addEventListener('click', function(){
          STATE.candidates.splice(idx, 1);
          buildPanel();
        });
      });
      document.getElementById('admin-add-cand').addEventListener('click', function(){
        STATE.candidates.push({name:'', overrides:{}});
        buildPanel();
      });
      document.getElementById('admin-publish').addEventListener('click', publish);
      document.getElementById('preview-as-candidate').addEventListener('click', function(){
        PREVIEW_MODE = true;
        panel.hidden = true;
        render();
      });
    }

    toggleBtn.addEventListener('click', function(){
      panel.hidden = !panel.hidden;
      if (!panel.hidden){
        PREVIEW_MODE = false;
        render();
        buildPanel();
      }
    });

    async function publish(){
      var statusEl = document.getElementById('admin-status');
      var btn = document.getElementById('admin-publish');
      btn.disabled = true;
      statusEl.textContent = 'Publication en cours…';
      try{
        if (!window.claude || !window.claude.use){
          statusEl.textContent = 'Publication indisponible dans cet aperçu.';
          btn.disabled = false;
          return;
        }
        var artifact = await window.claude.use('artifact');
        if (!artifact){
          statusEl.textContent = 'Capacité de publication indisponible ici.';
          btn.disabled = false;
          return;
        }
        document.getElementById('state-json').textContent = JSON.stringify(STATE);
        var html = fullDocument(STATE);
        await artifact.publish(html);
        statusEl.textContent = 'Publié. La page se recharge…';
      } catch(err){
        var code = err && err.code;
        if (code === 'not_writer' || code === 'not_granted'){
          statusEl.textContent = 'Vous n’avez pas les droits de publication sur cette page.';
        } else if (code === 'conflict'){
          statusEl.textContent = 'Une autre modification vient d’être publiée, la page se recharge.';
        } else {
          statusEl.textContent = 'Échec de la publication. Réessayez.';
        }
        btn.disabled = false;
      }
    }
  }
})();
</script>
